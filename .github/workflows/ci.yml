name: CI - Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t appwebapi-backend ./AppWebApi

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t myapp-frontend ./App

  deploy-staging:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render staging deploys
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_STAGING_HOOK }}"
          curl -X POST "${{ secrets.RENDER_FRONTEND_STAGING_HOOK }}"

  deploy-production:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render production deploys
        run: |
          curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"