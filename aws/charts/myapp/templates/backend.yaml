apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: PORT
              value: "8080"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.db.secretName }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.db.secretName }}
                  key: password
            - name: ConnectionStrings__DefaultConnection
              value: "Host={{ .Values.backend.db.writerHost }};Port=5432;Database={{ .Values.backend.db.name }};Username=$(DB_USERNAME);Password=$(DB_PASSWORD);SSL Mode=VerifyFull;Root Certificate=/etc/ssl/certs/rds/global-bundle.pem"
            - name: ConnectionStrings__ReadOnlyConnection
              value: "Host={{ .Values.backend.db.readerHost }};Port=5432;Database={{ .Values.backend.db.name }};Username=$(DB_USERNAME);Password=$(DB_PASSWORD);SSL Mode=VerifyFull;Root Certificate=/etc/ssl/certs/rds/global-bundle.pem"
            - name: JwtSettings__Secret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.appSecretName }}
                  key: jwtSecret
            - name: Stripe__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.appSecretName }}
                  key: stripeApiKey
            - name: Stripe__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.appSecretName }}
                  key: stripeWebhookSecret
            - name: Xendit__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.appSecretName }}
                  key: xenditApiKey
            - name: Lalamove__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.appSecretName }}
                  key: lalamoveApiKey
            - name: Lalamove__ApiSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.appSecretName }}
                  key: lalamoveApiSecret
{{- range $index, $origin := .Values.backend.corsAllowedOrigins }}
            - name: Cors__AllowedOrigins__{{ $index }}
              value: {{ $origin | quote }}
{{- end }}
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/ssl/certs/rds
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: rds-ca
          configMap:
            name: aws-rds-ca
            items:
              - key: global-bundle.pem
                path: global-bundle.pem
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}